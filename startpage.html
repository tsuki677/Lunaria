<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06071a">
  <title>Lunaria — новая вкладка</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #06071a;
      color: #e9ecff;
      --accent: #a78bfa;
      --silver: #c8d8f0;
      --muted: #949dbb;
      --glass: rgba(17, 20, 47, .70);
      --line: rgba(200, 216, 240, .14);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(99, 87, 170, .22), transparent 42%),
        radial-gradient(ellipse at 8% 92%, rgba(71, 89, 155, .14), transparent 33%),
        linear-gradient(145deg, #06071a 0%, #090c24 55%, #08091c 100%);
    }
    .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .stars {
      position: absolute; inset: 0; opacity: .8;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(235,238,255,.9) 50%, transparent 60%),
        radial-gradient(1px 1px at 29% 31%, rgba(200,216,240,.65) 50%, transparent 60%),
        radial-gradient(1.5px 1.5px at 78% 16%, rgba(235,238,255,.8) 50%, transparent 60%),
        radial-gradient(1px 1px at 86% 62%, rgba(200,216,240,.6) 50%, transparent 60%),
        radial-gradient(1px 1px at 18% 78%, rgba(167,139,250,.8) 50%, transparent 60%),
        radial-gradient(1px 1px at 65% 85%, rgba(235,238,255,.55) 50%, transparent 60%),
        radial-gradient(2px 2px at 54% 22%, rgba(167,139,250,.7) 50%, transparent 60%),
        radial-gradient(1px 1px at 93% 34%, rgba(235,238,255,.75) 50%, transparent 60%);
    }
    .moon {
      position: absolute; top: 10%; right: 12%; width: clamp(64px, 8vw, 102px);
      aspect-ratio: 1; border-radius: 50%; background: #e6e8ff;
      box-shadow: 0 0 35px rgba(200,216,240,.25), 0 0 110px rgba(167,139,250,.14);
      opacity: .88;
    }
    .moon::after {
      content: ""; position: absolute; top: -9%; left: 27%; width: 100%; aspect-ratio: 1;
      border-radius: 50%; background: #0a0b21;
    }
    header {
      position: relative; z-index: 1; display: flex; justify-content: flex-end;
      align-items: center; padding: 22px 28px; min-height: 72px;
    }
    .brand-chip {
      display: inline-flex; align-items: center; gap: 8px; color: #b9c4e3;
      border: 1px solid rgba(200,216,240,.11); background: rgba(8,10,30,.34);
      border-radius: 20px; padding: 7px 12px; font-size: .78rem; letter-spacing: .04em;
    }
    .brand-dot { color: var(--accent); font-size: 1rem; }
    main {
      position: relative; z-index: 1; width: min(760px, calc(100% - 36px));
      margin: auto; padding: 30px 0 66px; text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo-row { display: flex; align-items: center; justify-content: center; gap: 13px; margin-bottom: 30px; }
    .logo-moon {
      width: 43px; height: 43px; border-radius: 50%; position: relative;
      background: linear-gradient(145deg, #e7e8ff, #a78bfa);
      box-shadow: 0 0 30px rgba(167,139,250,.22);
    }
    .logo-moon::after {
      content: ""; position: absolute; width: 39px; height: 39px; right: -7px; top: -4px;
      border-radius: 50%; background: #090b22;
    }
    h1 {
      margin: 0; font-weight: 500; font-size: clamp(2.5rem, 6vw, 3.6rem);
      letter-spacing: -.045em; color: #f0f2ff;
      text-shadow: 0 0 35px rgba(167,139,250,.16);
    }
    .tagline { margin: 7px 0 27px; color: var(--muted); font-size: .93rem; }
    .search {
      width: min(100%, 620px); display: flex; align-items: center; gap: 13px;
      padding: 7px 9px 7px 20px; border: 1px solid rgba(200,216,240,.17);
      border-radius: 28px; background: rgba(22,25,54,.83);
      box-shadow: 0 12px 40px rgba(0,0,0,.18), 0 0 26px rgba(167,139,250,.06);
      backdrop-filter: blur(18px); transition: border-color .18s ease, box-shadow .18s ease;
    }
    .search:focus-within {
      border-color: rgba(167,139,250,.64);
      box-shadow: 0 0 0 3px rgba(167,139,250,.09), 0 12px 40px rgba(0,0,0,.2);
    }
    .search-icon { color: #abb6d5; font-size: 1.3rem; line-height: 1; }
    .search input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      color: #f0f2ff; padding: 13px 0; font: inherit; font-size: .98rem;
    }
    .search input::placeholder { color: #939dbb; }
    .search button {
      flex: 0 0 auto; width: 42px; height: 42px; border: 0; border-radius: 50%;
      display: grid; place-items: center; background: rgba(167,139,250,.17);
      color: #e5ddff; cursor: pointer; font-size: 1.15rem;
      transition: background .18s ease, transform .18s ease;
    }
    .search button:hover { background: rgba(167,139,250,.3); transform: scale(1.04); }
    .section-title {
      margin: 43px 0 20px; color: #9da8c7; font-size: .78rem; font-weight: 500;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .tiles {
      width: min(100%, 640px); display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 15px 12px;
    }
    .tile {
      min-width: 0; display: flex; align-items: center; flex-direction: column; gap: 10px;
      color: #dce2f7; text-decoration: none; border-radius: 15px; padding: 9px 2px 10px;
      transition: background .16s ease, transform .16s ease;
    }
    .tile:hover, .tile:focus-visible { background: rgba(167,139,250,.09); outline: none; transform: translateY(-2px); }
    .tile-icon {
      width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(242, 244, 255, .96); border: 1px solid rgba(255,255,255,.44);
      box-shadow: 0 5px 20px rgba(0,0,0,.2), 0 0 18px rgba(167,139,250,.05);
      transition: box-shadow .18s ease, transform .18s ease;
    }
    .tile-icon svg { display: block; width: 27px; height: 27px; }
    .tile:hover .tile-icon { box-shadow: 0 7px 24px rgba(0,0,0,.24), 0 0 20px rgba(167,139,250,.16); }
    .tile-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .78rem; color: #cbd4ee; }
    .yume { background: linear-gradient(145deg, #eee6ff, #c6b2ff); }
    .youtube { background: #fff; }
    .github { background: #f5f5f7; }
    .anilist { background: #e6f0ff; }
    .wiki { background: #f5f5f7; }
    .reddit { background: #fff0e8; }
    .discord { background: #eceeff; }
    .spotify { background: #e4f9ec; }
    footer {
      position: relative; z-index: 1; display: flex; justify-content: space-between;
      align-items: center; gap: 16px; padding: 18px 24px 21px; color: #7f8aaa; font-size: .75rem;
    }
    .footer-note { opacity: .88; }
    .customize {
      border: 1px solid rgba(200,216,240,.14); border-radius: 22px;
      padding: 9px 14px; color: #cbd4ee; background: rgba(15,18,43,.62);
      font: inherit; font-size: .78rem;
    }
    @media (max-width: 680px) {
      .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 400px; }
      .moon { top: 8%; right: -23px; width: 65px; opacity: .54; }
      main { padding-top: 25px; }
      .section-title { margin-top: 34px; }
      header { min-height: 58px; padding: 14px 17px; }
      footer { padding: 16px; }
    }
    @media (max-width: 380px) {
      .logo-row { gap: 9px; }
      .logo-moon { width: 34px; height: 34px; }
      .logo-moon::after { width: 31px; height: 31px; }
      h1 { font-size: 2.25rem; }
      .tile-icon { width: 46px; height: 46px; }
      .search { padding-left: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="stars"></div><div class="moon"></div></div>
  <header><span class="brand-chip"><span class="brand-dot">✦</span> LUNARIA · NEW TAB</span></header>
  <main>
    <div class="logo-row" aria-label="Lunaria">
      <span class="logo-moon" aria-hidden="true"></span>
      <h1>Lunaria</h1>
    </div>
    <p class="tagline">Твоя тихая сторона интернета</p>
    <form class="search" action="https://www.google.com/search" method="get" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" name="q" placeholder="Искать в Google или ввести запрос…" aria-label="Поиск Google" autocomplete="off" required>
      <button type="submit" aria-label="Искать">⌕</button>
    </form>
    <h2 class="section-title">Быстрый доступ</h2>
    <nav class="tiles" aria-label="Избранные сайты">
      <a class="tile" href="https://yumeplay.fun"><span class="tile-icon yume" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M20.5 4.8a11.9 11.9 0 1 0 6.7 21.6A13 13 0 0 1 20.5 4.8Z" fill="#7252d6"/><path d="m23.5 9.5 1.5 3.1 3.4.5-2.45 2.4.58 3.4-3.03-1.6-3.04 1.6.58-3.4-2.46-2.4 3.4-.5 1.49-3.1Z" fill="#fff"/></svg></span><span class="tile-name">YumePlay</span></a>
      <a class="tile" href="https://www.youtube.com"><span class="tile-icon youtube" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="2.5" y="6" width="27" height="20" rx="6" fill="#ff0033"/><path d="M13 11.5 21 16l-8 4.5Z" fill="white"/></svg></span><span class="tile-name">YouTube</span></a>
      <a class="tile" href="https://github.com"><span class="tile-icon github" aria-hidden="true"><svg viewBox="0 0 32 32"><path fill="#24292f" d="M16 3.1a13 13 0 0 0-4.11 25.34c.65.12.89-.28.89-.62v-2.4c-3.63.79-4.4-1.54-4.4-1.54-.59-1.51-1.45-1.91-1.45-1.91-1.19-.81.09-.8.09-.8 1.31.09 2 .1 2.95 1.89 1.17 2 3.08 1.42 3.83 1.08.12-.85.46-1.42.84-1.75-2.9-.33-5.96-1.45-5.96-6.45 0-1.43.51-2.59 1.35-3.5-.14-.33-.59-1.66.13-3.45 0 0 1.1-.35 3.58 1.34a12.4 12.4 0 0 1 6.52 0c2.49-1.69 3.58-1.34 3.58-1.34.72 1.79.27 3.12.13 3.45.84.91 1.35 2.07 1.35 3.5 0 5.01-3.07 6.11-5.99 6.44.47.41.89 1.2.89 2.42v3.02c0 .34.23.75.89.62A13 13 0 0 0 16 3.1Z"/></svg></span><span class="tile-name">GitHub</span></a>
      <a class="tile" href="https://anilist.co"><span class="tile-icon anilist" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 25.5 13.3 6h5.4L26 25.5h-5.1l-1.25-3.7h-7.3l-1.3 3.7Z" fill="#176be5"/><path d="m14 17.8 2-6 2.05 6Z" fill="#e6f0ff"/></svg></span><span class="tile-name">AniList</span></a>
      <a class="tile" href="https://www.wikipedia.org"><span class="tile-icon wiki" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.1" stroke="#333" stroke-width="1.5"/><path d="M4.7 13h22.6M4.7 19h22.6M16 3.9c3.2 3.4 4.8 7.4 4.8 12.1S19.2 24.7 16 28.1C12.8 24.7 11.2 20.7 11.2 16S12.8 7.3 16 3.9Z" stroke="#333" stroke-width="1.25"/><path d="m10 12 2 8 3-5 3 5 2-8" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tile-name">Wikipedia</span></a>
      <a class="tile" href="https://www.reddit.com"><span class="tile-icon reddit" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="17" r="10.5" fill="#ff4500"/><circle cx="12.1" cy="16.5" r="1.5" fill="white"/><circle cx="19.9" cy="16.5" r="1.5" fill="white"/><path d="M11.5 20c2.6 2.3 6.4 2.3 9 0" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="m17 6 2.4 1.2" stroke="#ff4500" stroke-width="2" stroke-linecap="round"/><circle cx="21.4" cy="7.1" r="2.1" fill="#ff4500"/></svg></span><span class="tile-name">Reddit</span></a>
      <a class="tile" href="https://discord.com"><span class="tile-icon discord" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 8.5c5.1-2.2 10.9-2.2 16 0 2.3 3.2 3.6 7.1 3.8 11.2-2 2.5-4.4 4-6.8 4.7l-1.5-2.3c.9-.3 1.8-.8 2.5-1.4-4 1.9-8.2 1.9-12.2 0 .8.6 1.6 1.1 2.5 1.4l-1.5 2.3c-2.4-.7-4.8-2.2-6.8-4.7.2-4.1 1.5-8 3.8-11.2Z" fill="#5865f2"/><ellipse cx="12.2" cy="16" rx="1.8" ry="2.1" fill="white"/><ellipse cx="19.8" cy="16" rx="1.8" ry="2.1" fill="white"/></svg></span><span class="tile-name">Discord</span></a>
      <a class="tile" href="https://open.spotify.com"><span class="tile-icon spotify" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="#1ed760"/><path d="M8.1 12.1c5.6-1.7 11.5-.9 16.1 1.9M9 16.2c4.6-1.3 9.6-.7 13.4 1.7M10 20.1c3.7-1 7.2-.4 10 1.3" fill="none" stroke="#102918" stroke-width="2.1" stroke-linecap="round"/></svg></span><span class="tile-name">Spotify</span></a>
    </nav>
  </main>
  <footer><span class="footer-note">Где ночь встречается с мечтой · Lunaria</span><span class="customize">☾ Под луной</span></footer>
</body>
</html>
