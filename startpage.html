<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Lunaria</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
        background: #06071a;
        color: #c8d8f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --lavender: #a78bfa;
        --silver: #c8d8f0;
        --muted: #8e9bb8;
        --surface: rgba(17, 21, 51, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(75, 67, 139, 0.2), transparent 48%),
          radial-gradient(circle at 12% 78%, rgba(63, 85, 151, 0.12), transparent 28%),
          #06071a;
      }

      .sky {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .moon {
        position: absolute;
        top: 12%;
        right: 14%;
        width: 94px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #e5e7ff;
        box-shadow: 0 0 36px rgba(200, 216, 240, 0.3), 0 0 100px rgba(167, 139, 250, 0.16);
      }

      .moon::after {
        position: absolute;
        top: -9px;
        left: 25px;
        width: 94px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #090b23;
        content: "";
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 12% 18%, rgba(235, 238, 255, 0.78) 50%, transparent),
          radial-gradient(1px 1px at 32% 32%, rgba(200, 216, 240, 0.58) 50%, transparent),
          radial-gradient(1px 1px at 72% 24%, rgba(235, 238, 255, 0.72) 50%, transparent),
          radial-gradient(1px 1px at 84% 68%, rgba(200, 216, 240, 0.6) 50%, transparent),
          radial-gradient(1px 1px at 22% 76%, rgba(167, 139, 250, 0.74) 50%, transparent),
          radial-gradient(1px 1px at 62% 84%, rgba(235, 238, 255, 0.58) 50%, transparent);
      }

      main {
        position: relative;
        width: min(680px, calc(100% - 40px));
        padding: 50px 0 60px;
      }

      .intro {
        margin-bottom: 32px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--lavender);
        font-size: 0.76rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #f0f2ff;
        font-size: clamp(2.3rem, 7vw, 3.8rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-shadow: 0 0 28px rgba(167, 139, 250, 0.22);
      }

      .date {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .clock {
        margin: 0 0 28px;
        color: var(--silver);
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: 0.08em;
        text-align: center;
      }

      .search {
        display: flex;
        gap: 10px;
        padding: 8px;
        border: 1px solid rgba(200, 216, 240, 0.16);
        border-radius: 16px;
        background: rgba(14, 17, 43, 0.78);
        box-shadow: 0 12px 42px rgba(0, 0, 0, 0.22), 0 0 24px rgba(167, 139, 250, 0.07);
        backdrop-filter: blur(16px);
      }

      .search:focus-within {
        border-color: rgba(167, 139, 250, 0.62);
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1), 0 12px 42px rgba(0, 0, 0, 0.22);
      }

      .search input {
        min-width: 0;
        flex: 1;
        padding: 12px 14px;
        border: 0;
        outline: 0;
        background: transparent;
        color: #f0f2ff;
        font: inherit;
        font-size: 1rem;
      }

      .search input::placeholder {
        color: #8490ad;
      }

      .search button {
        padding: 0 20px;
        border: 0;
        border-radius: 11px;
        background: linear-gradient(135deg, #a78bfa, #8374d6);
        color: #100f29;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition: filter 160ms ease, transform 160ms ease;
      }

      .search button:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
      }

      .section-title {
        margin: 35px 0 14px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .tile {
        min-height: 92px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 9px;
        padding: 15px;
        border: 1px solid rgba(200, 216, 240, 0.11);
        border-radius: 14px;
        background: var(--surface);
        color: var(--silver);
        text-decoration: none;
        backdrop-filter: blur(12px);
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .tile:hover,
      .tile:focus-visible {
        border-color: rgba(167, 139, 250, 0.48);
        background: rgba(34, 31, 73, 0.78);
        box-shadow: 0 0 22px rgba(167, 139, 250, 0.1);
        outline: 0;
        transform: translateY(-2px);
      }

      .tile-icon {
        color: var(--lavender);
        font-size: 1.15rem;
        line-height: 1;
      }

      .tile-name {
        overflow: hidden;
        font-size: 0.86rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      footer {
        margin-top: 24px;
        color: #737f9e;
        font-size: 0.78rem;
        text-align: center;
      }

      @media (max-width: 560px) {
        .moon {
          top: 5%;
          right: -25px;
          width: 70px;
        }

        main {
          padding-top: 36px;
        }

        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="stars"></div>
      <div class="moon"></div>
    </div>
    <main>
      <header class="intro">
        <p class="eyebrow">Find your quiet corner</p>
        <h1>Lunaria</h1>
        <p class="date" id="date"></p>
      </header>

      <p class="clock" id="clock" aria-label="Текущее время"></p>

      <form class="search" action="https://duckduckgo.com/" method="get" role="search">
        <input
          type="search"
          name="q"
          placeholder="Искать в интернете…"
          aria-label="Поисковый запрос"
          autocomplete="off"
          required
        >
        <button type="submit">Найти</button>
      </form>

      <h2 class="section-title">Избранное</h2>
      <nav class="tiles" aria-label="Избранные сайты">
        <a class="tile" href="https://yumeplay.fun">
          <span class="tile-icon" aria-hidden="true">✦</span>
          <span class="tile-name">YumePlay</span>
        </a>
        <a class="tile" href="https://www.youtube.com">
          <span class="tile-icon" aria-hidden="true">◉</span>
          <span class="tile-name">YouTube</span>
        </a>
        <a class="tile" href="https://github.com">
          <span class="tile-icon" aria-hidden="true">⌘</span>
          <span class="tile-name">GitHub</span>
        </a>
        <a class="tile" href="https://www.wikipedia.org">
          <span class="tile-icon" aria-hidden="true">❖</span>
          <span class="tile-name">Wikipedia</span>
        </a>
      </nav>

      <footer>Где ночь встречается с мечтой</footer>
    </main>
    <script>
      const timeFormatter = new Intl.DateTimeFormat("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
      });
      const dateFormatter = new Intl.DateTimeFormat("ru-RU", {
        weekday: "long",
        day: "numeric",
        month: "long",
      });
      const clock = document.getElementById("clock");
      const date = document.getElementById("date");

      function updateTime() {
        const now = new Date();
        clock.textContent = timeFormatter.format(now);
        date.textContent = dateFormatter.format(now);
      }

      updateTime();
      window.setInterval(updateTime, 30_000);
    </script>
  </body>
</html>
